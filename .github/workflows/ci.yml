name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test API, persistence, and recovery
        run: python -m unittest discover -s tests -v
      - name: Check CLI and Compose configuration
        run: |
          ./outpost --help
          ./outpost init --domain api.example.com --host example --name smoke
          docker compose config --quiet
      - name: Build container
        run: docker build -t outpost-test .
